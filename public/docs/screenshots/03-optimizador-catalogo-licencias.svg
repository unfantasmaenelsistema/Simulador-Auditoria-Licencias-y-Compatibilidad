<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1280" height="740" fill="#f8fafc"/>

  <!-- Top Navigation Bar -->
  <rect width="1280" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="36" font-size="17" font-weight="700" fill="#0f172a">Un Fantasma en el Sistema</text>
  <text x="380" y="36" font-size="13" font-weight="500" fill="#64748b">Auditoría de Equipos</text>
  <text x="545" y="36" font-size="13" font-weight="500" fill="#64748b">Laboratorio 32 vs 64 bits</text>
  <text x="725" y="36" font-size="13" font-weight="600" fill="#0f172a">Catálogo y Licencias</text>
  <line x1="725" y1="46" x2="858" y2="46" stroke="#0284c7" stroke-width="2.5"/>
  <text x="880" y="36" font-size="13" font-weight="500" fill="#64748b">Acta y Evaluación</text>

  <!-- Section 1: Bulk Optimization Policies -->
  <rect x="32" y="80" width="1216" height="270" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="106" font-size="11" font-weight="600" fill="#0284c7">Políticas de Homogeneización y Ahorro de Costes</text>
  <text x="56" y="128" font-size="18" font-weight="700" fill="#0f172a">Optimizador del Catálogo de Software Ofimático y Utilidades</text>

  <!-- 3 Policy Cards Row -->
  <rect x="56" y="150" width="376" height="176" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="172" font-size="10.5" fill="#64748b">Utilidades de Compresión · Ahorro y Legalidad</text>
  <text x="72" y="192" font-size="13.5" font-weight="700" fill="#0f172a">Estandarizar 7-Zip (GNU LGPL) en la oficina</text>
  <text x="72" y="214" font-size="11" fill="#475569">Elimina los WinRAR con evaluación expirada (412 días),</text>
  <text x="72" y="230" font-size="11" fill="#475569">instalando 7-Zip x64 en puestos 64-bit y 7-Zip x86 en 32-bit.</text>
  <rect x="72" y="278" width="344" height="34" rx="6" fill="#0f172a"/>
  <text x="244" y="299" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Desplegar 7-Zip (0 €) →</text>

  <rect x="452" y="150" width="376" height="176" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="468" y="172" font-size="10.5" fill="#64748b">Catálogo Ofimático · Erradicación EULA Hogar</text>
  <text x="468" y="192" font-size="13.5" font-weight="700" fill="#0f172a">Migrar Ofimática a LibreOffice (GNU/MPL)</text>
  <text x="468" y="214" font-size="11" fill="#475569">Reemplaza las ediciones ilegales de Office Hogar y Estudiantes</text>
  <text x="468" y="230" font-size="11" fill="#475569">por LibreOffice 64 bits (y 32 bits en Recepción).</text>
  <rect x="468" y="278" width="344" height="34" rx="6" fill="#0f172a"/>
  <text x="640" y="299" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Estandarizar LibreOffice (0 €) →</text>

  <rect x="848" y="150" width="376" height="176" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="864" y="172" font-size="10.5" fill="#64748b">Gestión Documental PDF · Eliminación de Cracks</text>
  <text x="864" y="192" font-size="13.5" font-weight="700" fill="#0f172a">Sustituir Acrobat Crack por PDFsam + Evince</text>
  <text x="864" y="214" font-size="11" fill="#475569">Desinstala el Adobe Acrobat Pro pirata en Diseño y despliega</text>
  <text x="864" y="230" font-size="11" fill="#475569">PDFsam Basic (64-bit) y Evince (32-bit) bajo GNU/GPL.</text>
  <rect x="864" y="278" width="344" height="34" rx="6" fill="#0f172a"/>
  <text x="1036" y="299" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Normalizar Catálogo PDF (0 €) →</text>

  <!-- Section 2: Reference Matrix Table -->
  <rect x="32" y="370" width="1216" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="402" font-size="15" font-weight="700" fill="#0f172a">Tabla Técnica de Referencia: Tipos de Licencia en Auditoría Informática</text>
  <text x="56" y="420" font-size="11.5" fill="#64748b">Pasa el cursor sobre cada licencia (OEM, Retail, Volumen, GNU/GPL) para consultar sus restricciones legales EULA.</text>

  <!-- Table Header -->
  <line x1="56" y1="438" x2="1224" y2="438" stroke="#cbd5e1"/>
  <text x="56" y="458" font-size="11" font-weight="700" fill="#475569">Tipo de Licencia</text>
  <text x="310" y="458" font-size="11" font-weight="700" fill="#475569">¿Válida en Empresa?</text>
  <text x="500" y="458" font-size="11" font-weight="700" fill="#475569">Transferencia de Hardware</text>
  <text x="770" y="458" font-size="11" font-weight="700" fill="#475569">Coste Orientativo</text>
  <text x="945" y="458" font-size="11" font-weight="700" fill="#475569">Regla Crítica de Auditoría</text>
  <line x1="56" y1="468" x2="1224" y2="468" stroke="#e2e8f0"/>

  <!-- Row 1: OEM -->
  <text x="56" y="494" font-size="11.5" font-weight="700" fill="#0f172a" text-decoration="underline">OEM (Fabricante) (?)</text>
  <text x="310" y="494" font-size="11" fill="#334155">Sí (en equipo original)</text>
  <text x="500" y="494" font-size="11" fill="#dc2626">NO transferible (1ª placa base)</text>
  <text x="770" y="494" font-size="11" font-family="monospace" fill="#334155">Incluido con PC</text>
  <text x="945" y="494" font-size="11" fill="#475569">Se invalida al cambiar de placa base o PC.</text>
  <line x1="56" y1="510" x2="1224" y2="510" stroke="#f1f5f9"/>

  <!-- Row 2: Retail -->
  <text x="56" y="536" font-size="11.5" font-weight="700" fill="#0f172a" text-decoration="underline">Retail / FPP (?)</text>
  <text x="310" y="536" font-size="11" fill="#334155">Sí (ediciones Pro)</text>
  <text x="500" y="536" font-size="11" fill="#059669">SÍ transferible a otro PC (1 activo)</text>
  <text x="770" y="536" font-size="11" font-family="monospace" fill="#334155">150 € – 300 €</text>
  <text x="945" y="536" font-size="11" fill="#475569">Permite migrar de un PC viejo a uno nuevo.</text>
  <line x1="56" y1="552" x2="1224" y2="552" stroke="#f1f5f9"/>

  <!-- Row 3: Volumen -->
  <text x="56" y="578" font-size="11.5" font-weight="700" fill="#0f172a" text-decoration="underline">Volumen (VLK / KMS) (?)</text>
  <text x="310" y="578" font-size="11" fill="#334155">Sí (corporativo)</text>
  <text x="500" y="578" font-size="11" fill="#059669">SÍ reasignable en la empresa</text>
  <text x="770" y="578" font-size="11" font-family="monospace" fill="#334155">140 € – 220 €</text>
  <text x="945" y="578" font-size="11" fill="#475569">Exige alcanzar el mínimo contractual (mín. 5).</text>
  <line x1="56" y1="594" x2="1224" y2="594" stroke="#f1f5f9"/>

  <!-- Row 4: GNU/GPL -->
  <text x="56" y="620" font-size="11.5" font-weight="700" fill="#0284c7" text-decoration="underline">GNU/GPL, LGPL, MPL (?)</text>
  <text x="310" y="620" font-size="11" font-weight="700" fill="#059669">SÍ (100% libre en empresas)</text>
  <text x="500" y="620" font-size="11" fill="#059669">Libre e ilimitada en cualquier PC</text>
  <text x="770" y="620" font-size="11" font-family="monospace" font-weight="700" fill="#059669">0 € en licencias</text>
  <text x="945" y="620" font-size="11" fill="#475569">Uso comercial garantizado por las 4 libertades.</text>
  <line x1="56" y1="636" x2="1224" y2="636" stroke="#f1f5f9"/>

  <!-- Row 5: Hogar -->
  <text x="56" y="662" font-size="11.5" font-weight="700" fill="#dc2626" text-decoration="underline">Hogar y Estudiantes (?)</text>
  <text x="310" y="662" font-size="11" font-weight="700" fill="#dc2626">NO (Prohibido en empresas)</text>
  <text x="500" y="662" font-size="11" fill="#64748b">Solo ámbito doméstico</text>
  <text x="770" y="662" font-size="11" font-family="monospace" fill="#334155">99 € – 149 €</text>
  <text x="945" y="662" font-size="11" fill="#dc2626">Incumple EULA en cualquier oficina o negocio.</text>
</svg>
