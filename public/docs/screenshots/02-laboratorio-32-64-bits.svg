<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Top Navigation Bar -->
  <rect width="1280" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="36" font-size="17" font-weight="700" fill="#0f172a">Un Fantasma en el Sistema</text>
  <text x="380" y="36" font-size="13" font-weight="500" fill="#64748b">Auditoría de Equipos</text>
  <text x="545" y="36" font-size="13" font-weight="600" fill="#0f172a">Laboratorio 32 vs 64 bits</text>
  <line x1="545" y1="46" x2="700" y2="46" stroke="#0284c7" stroke-width="2.5"/>
  <text x="725" y="36" font-size="13" font-weight="500" fill="#64748b">Catálogo y Licencias</text>
  <text x="880" y="36" font-size="13" font-weight="500" fill="#64748b">Acta y Evaluación</text>

  <!-- Module Header Card -->
  <rect x="32" y="80" width="1216" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="106" font-size="11" font-weight="600" fill="#0284c7">Simulador Conceptual Interactivo · Arquitectura de Computadores</text>
  <text x="56" y="130" font-size="19" font-weight="700" fill="#0f172a">Laboratorio Práctico: Direccionamiento de 32 bits (x86) frente a 64 bits (x86_64)</text>
  <text x="56" y="152" font-size="12" fill="#475569">Experimenta qué ocurre al combinar procesadores, sistemas operativos y aplicaciones de 32 y 64 bits, y la barrera de 2³² = 4 GB.</text>

  <!-- Left Sandbox Stage (7 cols) -->
  <rect x="32" y="196" width="710" height="492" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="228" font-size="14" font-weight="700" fill="#0f172a">1. Cadena de Compatibilidad Hardware → SO → Aplicación</text>
  <text x="515" y="228" font-size="11.5" font-family="monospace" fill="#64748b">Bus: 2³² = 4,29 × 10⁹ bytes</text>

  <!-- 3 Pipeline Boxes -->
  <rect x="56" y="246" width="208" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="70" y="268" font-size="11" fill="#64748b">1. Hardware (CPU)</text>
  <text x="70" y="292" font-size="14" font-weight="700" font-family="monospace" fill="#0f172a">x86_64 (64 bits)</text>
  <text x="70" y="314" font-size="10.5" fill="#475569">Registros: RAX (64b) + EAX (32b)</text>

  <rect x="282" y="246" width="208" height="90" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="296" y="268" font-size="11" fill="#92400e">2. Kernel / SO</text>
  <text x="296" y="292" font-size="14" font-weight="700" font-family="monospace" fill="#0f172a">SO de 32 bits</text>
  <text x="296" y="314" font-size="10.5" font-weight="600" fill="#b45309">▲ Cuello botella: Tope 3,2 GB</text>

  <rect x="508" y="246" width="210" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="522" y="268" font-size="11" fill="#991b1b">3. Binario App</text>
  <text x="522" y="292" font-size="14" font-weight="700" font-family="monospace" fill="#0f172a">App 64 bits (2.0 GB)</text>
  <text x="522" y="314" font-size="10.5" font-weight="600" fill="#dc2626">✖ Incomp: App 64b en SO 32b</text>

  <!-- Memory Map Section -->
  <line x1="56" y1="362" x2="718" y2="362" stroke="#e2e8f0"/>
  <text x="56" y="392" font-size="14" font-weight="700" fill="#0f172a">2. Mapa de Direccionamiento de Memoria RAM Física (8 GB Instalados)</text>
  <text x="56" y="410" font-size="11.5" fill="#64748b">Comparativa entre la memoria pinchada en placa base y la que el SO puede direccionar.</text>

  <!-- Segmented Bar -->
  <rect x="56" y="428" width="662" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <!-- 40% Usable -->
  <rect x="56" y="428" width="265" height="44" rx="6" fill="#059669"/>
  <text x="188" y="455" text-anchor="middle" font-size="12" font-family="monospace" font-weight="700" fill="#ffffff">Útil: 3.2 GB (40%)</text>
  <!-- 10% MMIO -->
  <rect x="321" y="428" width="66" height="44" fill="#f59e0b"/>
  <text x="354" y="455" text-anchor="middle" font-size="11" font-family="monospace" font-weight="700" fill="#0f172a">MMIO</text>
  <!-- 50% Wasted -->
  <rect x="387" y="428" width="331" height="44" rx="6" fill="#dc2626"/>
  <text x="552" y="455" text-anchor="middle" font-size="12" font-family="monospace" font-weight="700" fill="#ffffff">Inaccesible (&gt;4 GB): 4.0 GB (50%)</text>

  <text x="56" y="496" font-size="11" font-weight="600" fill="#059669">■ RAM Direccionable (3,2 GB)</text>
  <text x="245" y="496" font-size="11" font-weight="600" fill="#d97706">■ Reserva Hardware MMIO (0,8 GB)</text>
  <text x="465" y="496" font-size="11" font-weight="600" fill="#dc2626">■ RAM Ignorada por límite 32 bits (4,0 GB)</text>

  <!-- Live Diagnostic Box -->
  <rect x="56" y="525" width="662" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="552" font-size="13" font-weight="700" fill="#0f172a">Diagnóstico en Vivo del Simulador de Ejecución</text>
  <text x="76" y="576" font-size="11.5" fill="#334155">Error de ejecución (Bad Image / Formato de ejecutable inválido): Un sistema operativo</text>
  <text x="76" y="594" font-size="11.5" fill="#334155">de 32 bits no puede cargar binarios ni librerías compiladas para 64 bits (x86_64).</text>
  <text x="76" y="624" font-size="11.5" font-weight="600" fill="#0284c7">Solución: Instalar un SO de 64 bits (Windows 11 x64 o Ubuntu 24.04 amd64) para</text>
  <text x="76" y="642" font-size="11.5" font-weight="600" fill="#0284c7">recuperar los 8,0 GB completos de RAM y ejecutar software de 64 bits nativo.</text>

  <!-- Right Control Deck (5 cols) -->
  <rect x="762" y="196" width="486" height="492" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="786" y="228" font-size="14" font-weight="700" fill="#0f172a">Panel de Parámetros de Arquitectura</text>
  <text x="786" y="246" font-size="11" fill="#64748b">Modifica cada variable para comprobar la compatibilidad.</text>

  <!-- Control 1 -->
  <text x="786" y="280" font-size="11.5" font-weight="600" fill="#334155">1. Arquitectura del Procesador (CPU)</text>
  <rect x="786" y="290" width="438" height="38" rx="8" fill="#f1f5f9"/>
  <text x="895" y="314" text-anchor="middle" font-size="11.5" font-weight="500" fill="#64748b">CPU 32 bits (x86)</text>
  <rect x="1006" y="294" width="214" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1113" y="314" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">CPU 64 bits (x86_64)</text>

  <!-- Control 2 -->
  <text x="786" y="356" font-size="11.5" font-weight="600" fill="#334155">2. Arquitectura del Sistema Operativo</text>
  <rect x="786" y="366" width="438" height="38" rx="8" fill="#f1f5f9"/>
  <rect x="790" y="370" width="214" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="897" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">SO 32 bits (x86 / i386)</text>
  <text x="1113" y="390" text-anchor="middle" font-size="11.5" font-weight="500" fill="#64748b">SO 64 bits (x64 / amd64)</text>

  <!-- Control 3 -->
  <text x="786" y="434" font-size="11.5" font-weight="600" fill="#334155">3. Memoria RAM Física Instalada: 8 GB DDR</text>
  <line x1="786" y1="452" x2="1224" y2="452" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="786" y1="452" x2="910" y2="452" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="910" cy="452" r="9" fill="#0284c7"/>
  <text x="786" y="474" font-size="10" font-family="monospace" fill="#64748b">2 GB · 4 GB (Límite 2³²) · 8 GB · 16 GB · 32 GB</text>

  <!-- Golden Rules Summary -->
  <line x1="786" y1="505" x2="1224" y2="505" stroke="#e2e8f0"/>
  <text x="786" y="530" font-size="12" font-weight="700" fill="#0f172a">Reglas de Oro para el Examen / Auditoría:</text>
  <text x="786" y="554" font-size="11" fill="#334155">• CPU 64-bit + SO 32-bit: Desperdicia RAM &gt; 3,2 GB y bloquea apps 64b.</text>
  <text x="786" y="578" font-size="11" fill="#334155">• CPU 32-bit + SO 64-bit: No arranca jamás (faltan registros 64b).</text>
  <text x="786" y="602" font-size="11" fill="#334155">• SO 64-bit + App 32-bit: Funciona con WOW64 (tope 2-4 GB/proceso).</text>
</svg>
