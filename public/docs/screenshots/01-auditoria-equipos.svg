  <text x="1184" y="538" font-size="12" font-family="monospace" font-weight="700" fill="#0284c7">0 €</text>
  <text x="862" y="556" font-size="10.5" fill="#475569">Distribución Linux LTS de 64 bits. Coste 0 €, uso comercial libre.</text>
