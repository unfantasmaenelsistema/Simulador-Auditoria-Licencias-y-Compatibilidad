  <text x="472" y="410" font-size="12" font-weight="700" fill="#991b1b">✖ Cuello de botella de RAM: 4.8 GB desaprovechados por SO de 32 bits</text>
  <text x="472" y="427" font-size="11" fill="#7f1d1d">El equipo dispone de 8 GB de RAM física y CPU de 64 bits, pero Windows 10 Pro (32 bits) solo direcciona 2³² posiciones (3.2 GB útiles).</text>
  <text x="472" y="445" font-size="10.5" font-weight="600" fill="#991b1b">Criterio Didáctico: En equipos con 4 GB o más de RAM y CPU x86_64, instala un SO de 64 bits para direccionar toda la memoria.</text>

