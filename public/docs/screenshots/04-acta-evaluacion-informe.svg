  <!-- Quiz Preview Card -->
  <rect x="32" y="528" width="1216" height="164" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="558" font-size="15" font-weight="700" fill="#0f172a">2. Cuestionario de Verificación Conceptual (5 casos de examen)</text>
  <rect x="56" y="574" width="1168" height="96" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="74" y="598" font-size="12" font-weight="700" fill="#065f46">1. En un PC con Core i5 (x86_64) y 16 GB de RAM se instala Windows 10 Pro de 32 bits. ¿Qué ocurrirá?</text>
  <text x="74" y="622" font-size="11.5" font-weight="600" fill="#047857">✓ B) Arrancará, pero solo direccionará ~3,2 GB de RAM útiles y no ejecutará aplicaciones de 64 bits.</text>
  <text x="74" y="648" font-size="11" fill="#065f46">¡Respuesta correcta! Un SO de 32 bits tiene punteros de 32 bits (2³² = 4 GB), desperdiciando el resto de la RAM.</text>
</svg>
